plugins {
    id 'com.android.library'
}

android {
    namespace 'com.binarycalculator.termux'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    // JitPack multi-module coordinates use com.github.<owner>.<repo>:<module>:<commit>.
    // The previous group (com.termux.termux-app) generated an invalid Maven path
    // and could not resolve terminal-emulator's transitive AAR.
    implementation 'com.github.termux.termux-app:terminal-view:8629e632fc'
    // Required by Termux library consumers to avoid duplicate Guava ListenableFuture classes.
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}
