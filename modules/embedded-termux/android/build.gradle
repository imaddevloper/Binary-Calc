plugins {
    id 'com.android.library'
}

android {
    namespace 'com.binarycalculator.termux'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    // Pin the upstream terminal-view source commit. Its POM declares terminal-emulator
    // as an API dependency, but JitPack publishes that Android library with the
    // "release" classifier. Exclude the unclassified transitive artifact and request
    // the exact published AAR explicitly to avoid Gradle resolving a nonexistent file.
    implementation('com.termux.termux-app:terminal-view:8629e632fc') {
        exclude group: 'com.termux.termux-app', module: 'terminal-emulator'
    }
    implementation('com.termux.termux-app:terminal-emulator:8629e632fc') {
        artifact {
            name = 'terminal-emulator'
            type = 'aar'
            extension = 'aar'
            classifier = 'release'
        }
    }
    // Required by Termux library consumers to avoid duplicate Guava ListenableFuture classes.
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}
