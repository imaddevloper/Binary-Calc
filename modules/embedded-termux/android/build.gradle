plugins {
    id 'com.android.library'
}

android {
    namespace 'com.binarycalculator.termux'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    // Use Termux's preferred JitPack group and the pinned upstream source commit.
    // terminal-emulator is an API dependency of terminal-view; CI verifies both AARs
    // are published before Gradle starts so an in-progress JitPack build is not mistaken for a missing artifact.
    implementation 'com.termux.termux-app:terminal-view:8629e632fc'
    // Required by Termux library consumers to avoid duplicate Guava ListenableFuture classes.
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
}
