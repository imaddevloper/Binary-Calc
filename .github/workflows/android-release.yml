name: Android Release APK

on:
  # Automatic builds are temporarily disabled during maintenance.
  # Run manually from the Actions tab when explicitly requested.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bootstrap artifacts from the exact same commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ".github/workflows/embedded-termux-android.yml" --status completed --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful Embedded Termux Android run exists for this exact commit ($GITHUB_SHA). Refusing to build a release APK without verified runtime assets."
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          assets="$GITHUB_WORKSPACE/modules/embedded-termux/android/src/main/assets"
          mkdir -p "$assets"

          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name termux-bootstrap-aarch64 --dir "$temp_dir/aarch64"
          test -s "$temp_dir/aarch64/bootstrap-aarch64.zip"
          test -s "$temp_dir/aarch64/bootstrap-aarch64.zip.sha256"
          cp "$temp_dir/aarch64/bootstrap-aarch64.zip" "$assets/termux-bootstrap-aarch64.zip"
          cp "$temp_dir/aarch64/bootstrap-aarch64.zip.sha256" "$assets/termux-bootstrap-aarch64.zip.sha256"
          cp "$temp_dir/aarch64/termux-bootstrap-packages-aarch64.csv" "$assets/termux-bootstrap-packages-aarch64.csv"
          cp "$temp_dir/aarch64/termux-packages-source-commit-aarch64.txt" "$assets/termux-packages-source-commit-aarch64.txt"
          echo "$(cat "$assets/termux-bootstrap-aarch64.zip.sha256")  $assets/termux-bootstrap-aarch64.zip" | sha256sum -c -

          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name termux-bootstrap-arm --dir "$temp_dir/arm"; then
            test -s "$temp_dir/arm/bootstrap-arm.zip"
            test -s "$temp_dir/arm/bootstrap-arm.zip.sha256"
            cp "$temp_dir/arm/bootstrap-arm.zip" "$assets/termux-bootstrap-arm.zip"
            cp "$temp_dir/arm/bootstrap-arm.zip.sha256" "$assets/termux-bootstrap-arm.zip.sha256"
            cp "$temp_dir/arm/termux-bootstrap-packages-arm.csv" "$assets/termux-bootstrap-packages-arm.csv"
            cp "$temp_dir/arm/termux-packages-source-commit-arm.txt" "$assets/termux-packages-source-commit-arm.txt"
            echo "$(cat "$assets/termux-bootstrap-arm.zip.sha256")  $assets/termux-bootstrap-arm.zip" | sha256sum -c -
            echo "arm32-bootstrap=available" > "$assets/bootstrap-architecture-status.txt"
          else
            echo "::warning::No ARM32 Bootstrap artifact is available for this commit; release will be ARM64-only."
            echo "arm32-bootstrap=unavailable" > "$assets/bootstrap-architecture-status.txt"
          fi

          cp "$GITHUB_WORKSPACE/LICENSE" "$assets/BinaryCalc-GPL-3.0.txt"
          cp "$GITHUB_WORKSPACE/LICENSES/Apache-2.0.txt" "$assets/Apache-2.0.txt"
          cp "$GITHUB_WORKSPACE/NOTICE" "$assets/NOTICE.txt"
          echo "Using Bootstrap artifacts from run $run_id for commit $GITHUB_SHA."
          find "$assets" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Check Expo dependency compatibility
        run: npm run check-deps

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restrict release APK ABI when optional 32-bit Bootstrap is unavailable
        if: hashFiles('modules/embedded-termux/android/src/main/assets/termux-bootstrap-arm.zip') == ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          anchor = "defaultConfig {"
          if source.count(anchor) != 1:
              raise SystemExit("Could not identify exactly one defaultConfig block for ARM64-only release configuration.")
          if "abiFilters" in source:
              raise SystemExit("An existing ABI filter is present; refusing to overwrite it.")
          source = source.replace(anchor, anchor + '\n        ndk { abiFilters "arm64-v8a" }', 1)
          path.write_text(source)
          PY
          grep -Fq 'abiFilters "arm64-v8a"' android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify release APK identity, ABI and embedded runtime assets
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p release
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump badging "$apk" > release/apk-badging.txt
          grep -Fq "package: name='com.binarycalculator.app'" release/apk-badging.txt
          grep -Fq "targetSdkVersion:'36'" release/apk-badging.txt
          unzip -Z1 "$apk" | grep -Fxq 'assets/termux-bootstrap-aarch64.zip'
          unzip -Z1 "$apk" | grep -Fxq 'assets/termux-bootstrap-aarch64.zip.sha256'
          unzip -Z1 "$apk" | grep -Fxq 'assets/termux-bootstrap-packages-aarch64.csv'
          unzip -Z1 "$apk" | grep -Fxq 'assets/NOTICE.txt'
          unzip -Z1 "$apk" | grep -Fxq 'assets/BinaryCalc-GPL-3.0.txt'
          unzip -Z1 "$apk" | grep -Fxq 'assets/Apache-2.0.txt'
          if [[ -f modules/embedded-termux/android/src/main/assets/termux-bootstrap-arm.zip ]]; then
            unzip -Z1 "$apk" | grep -Fxq 'assets/termux-bootstrap-arm.zip'
            unzip -Z1 "$apk" | grep -Fxq 'assets/termux-bootstrap-arm.zip.sha256'
          else
            grep -Fq 'abiFilters "arm64-v8a"' android/app/build.gradle
          fi
          unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/.*\\.so      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binary-Calculator-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Binary-Calculator-*.apk
          fail_on_unmatched_files: true

          sha256sum "$apk" | tee release/app-release.apk.sha256
          echo "Release APK identity, target SDK, ARM64 native ABI, and required Termux assets verified."

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "Expected APK was not created: $APK_PATH"
            find android/app/build/outputs -maxdepth 5 -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p release
          cp "$APK_PATH" "release/Binary-Calculator-${GITHUB_REF_NAME}.apk"
          cp "$APK_PATH" "release/Binary-Calculator.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binary-Calculator-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Binary-Calculator-*.apk
          fail_on_unmatched_files: true
