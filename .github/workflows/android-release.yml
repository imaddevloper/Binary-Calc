name: Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK command-line tools (sdkmanager) were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "Expected APK was not created: $APK_PATH"
            find android/app/build/outputs -maxdepth 5 -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p release
          cp "$APK_PATH" "release/Binary-Calculator-${GITHUB_REF_NAME}.apk"
          cp "$APK_PATH" "release/Binary-Calculator.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binary-Calculator-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Binary-Calculator-*.apk
          fail_on_unmatched_files: true
