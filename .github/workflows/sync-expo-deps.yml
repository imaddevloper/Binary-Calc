name: Sync Expo SDK 58 dependency lock

on:
  push:
    branches:
      - work/binary-calc-safe-enhancements
    paths:
      - ".github/workflows/sync-expo-deps.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the currently locked dependency tree
        run: npm ci

      - name: Apply Expo SDK 58 compatible patch versions
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package-before.json
          npx expo install --fix
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          // Expo's resolver may leave this older tilde range unchanged because
          // 58.0.14 is technically inside ~58.0.13. Pin the SDK-validated range.
          pkg.dependencies["expo-file-system"] = "~58.0.14";
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install
          npm run check-deps
          python3 - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("/tmp/package-before.json").read_text())
          after = json.loads(Path("package.json").read_text())
          allowed = {
              "expo",
              "expo-dev-client",
              "expo-router",
              "expo-sqlite",
              "expo-file-system",
          }
          changed = set()
          for section in ("dependencies", "devDependencies"):
              old = before.get(section, {})
              new = after.get(section, {})
              for name in set(old) | set(new):
                  if old.get(name) != new.get(name):
                      changed.add(name)
                      if name not in allowed or section != "dependencies":
                          raise SystemExit(
                              f"Unexpected package.json change: {section}.{name}: "
                              f"{old.get(name)!r} -> {new.get(name)!r}"
                          )
          if changed != allowed:
              raise SystemExit(
                  f"Expected exactly five Expo dependencies to change; got {sorted(changed)}"
              )
          expected = {
              "expo": "~58.0.26",
              "expo-dev-client": "~58.0.21",
              "expo-router": "~58.0.32",
              "expo-sqlite": "~58.0.18",
              "expo-file-system": "~58.0.14",
          }
          for name, version in expected.items():
              actual = after["dependencies"].get(name)
              if actual != version:
                  raise SystemExit(
                      f"Unexpected Expo-compatible version for {name}: {actual!r}; "
                      f"expected {version!r}"
                  )
          print("Verified: exactly the five Expo SDK 58 dependency ranges changed.")
          PY

      - name: Verify clean lockfile installation and commit dependency files
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check-deps
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Expo dependencies and lockfile are already synchronized."
            exit 0
          fi
          git commit -m "chore(deps): align Expo SDK 58 patch versions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
